name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/android-project]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Firebase configuration
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_BASE64 }}
        run: |
          test -n "$FIREBASE_CONFIG_BASE64" || { echo 'Missing FIREBASE_CONFIG_BASE64 secret'; exit 1; }
          printf '%s' "$FIREBASE_CONFIG_BASE64" | base64 --decode > app/google-services.json
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SBI-Global-Markets-debug
          path: app/build/outputs/apk/debug/*.apk
